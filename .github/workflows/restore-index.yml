name: Restore verified index

on:
  push:
    branches: [main]
    paths:
      - 'source/index.parts/**'
      - '.github/workflows/restore-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified index.html
        shell: bash
        run: |
          set -euo pipefail
          cat source/index.parts/part*.b64 | base64 -d | gzip -dc > index.verified.html
          EXPECTED='1d16cc8392222c60b3da946eb199885516cedff640776967fa5c86220cb9356f'
          ACTUAL="$(sha256sum index.verified.html | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          mv index.verified.html index.html

      - name: Commit exact source when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'index.html is already exact.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restaurar HTML original verificado'
          git push origin HEAD:main
